<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Professional To-Do App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="app-header">
            <h1>My To-Do List</h1>
            <p>Organize your tasks and stay productive.</p>
        </header>

<div class="toolbar">

    <input
        type="text"
        id="searchInput"
        placeholder="Search tasks..."
        autocomplete="off"
    >

    <select id="sortInput">

        <option value="newest">
            Newest First
        </option>

        <option value="oldest">
            Oldest First
        </option>

        <option value="priority">
            Priority
        </option>

    </select>

    <button id="themeToggle" type="button">
        🌙 Dark Mode
    </button>

</div>

        <!-- Add Task Form -->

        <form id="taskForm" class="task-form">

            <input
                type="text"
                id="taskInput"
                placeholder="What needs to be done?"
                autocomplete="off"
                required
            >

            <select id="priorityInput">

                <option value="low">Low Priority</option>
                <option value="medium" selected>Medium Priority</option>
                <option value="high">High Priority</option>

            </select>


            <input
                type="date"
                id="dateInput"
            >


            <button type="submit">
                Add Task
            </button>

        </form>


        <!-- Filters -->

        <div class="filters">

            <button
                class="filter active"
                data-filter="all"
                type="button"
            >
                All
            </button>

            <button
                class="filter"
                data-filter="active"
                type="button"
            >
                Active
            </button>

            <button
                class="filter"
                data-filter="completed"
                type="button"
            >
                Completed
            </button>

        </div>


        <!-- Task List -->

        <ul id="taskList"></ul>


        <!-- Footer -->

        <div class="footer">

            <span id="taskCount">
                0 tasks remaining
            </span>

            <button
                id="clearCompleted"
                type="button"
            >
                Clear Completed
            </button>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
